<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIDI 변환 도구 - Strudel Music</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
        background: #0d0d0d;
        color: #f5f5f5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 3rem 1.5rem;
      }
      header {
        width: 100%;
        max-width: 900px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4rem;
      }
      .brand {
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #f5f5f5;
      }
      .brand span { color: #8a8a8a; font-weight: 400; }
      nav { display: flex; gap: 0.5rem; }
      .navBtn {
        font-family: inherit;
        font-size: 0.88rem;
        font-weight: 600;
        padding: 0.55rem 1.3rem;
        border-radius: 2px;
        text-decoration: none;
        color: #8a8a8a;
        border: 1px solid #2a2a2a;
        transition: color 0.15s, border-color 0.15s, background 0.15s;
      }
      .navBtn:hover { color: #f5f5f5; border-color: #4a4a4a; }
      .navBtn.active {
        background: #f5f5f5;
        color: #0d0d0d;
        border-color: #f5f5f5;
      }
      /* 페이지 전환 페이드 모션 */
      body {
        animation: pageIn 0.25s ease both;
      }
      body.page-leaving {
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.12s ease, transform 0.12s ease;
      }
      @keyframes pageIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      h1 {
        font-size: 2.6rem;
        font-weight: 800;
        line-height: 1.35;
        letter-spacing: -0.02em;
        margin-bottom: 1.2rem;
        width: 100%;
        max-width: 900px;
      }
      .sub {
        color: #8a8a8a;
        font-size: 1.05rem;
        line-height: 1.7;
        margin-bottom: 3rem;
        width: 100%;
        max-width: 900px;
      }
      /* 업로드 영역 */
      #dropZone {
        width: 100%;
        max-width: 900px;
        border: 1px dashed #3a3a3a;
        border-radius: 4px;
        padding: 4rem 2rem;
        text-align: center;
        cursor: pointer;
        transition: border-color 0.2s, background 0.2s;
        margin-bottom: 1rem;
      }
      #dropZone:hover, #dropZone.dragover {
        border-color: #8a8a8a;
        background: #141414;
      }
      #dropZone .icon { font-size: 2rem; margin-bottom: 0.8rem; }
      #dropZone .main { font-size: 1.05rem; font-weight: 600; margin-bottom: 0.4rem; }
      #dropZone .desc { color: #8a8a8a; font-size: 0.9rem; }
      #fileInput { display: none; }

      /* 옵션 */
      .options {
        width: 100%;
        max-width: 900px;
        display: flex;
        gap: 1.5rem;
        align-items: center;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
      }
      .options label {
        color: #8a8a8a;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .options input[type="number"] {
        width: 5rem;
        background: #141414;
        border: 1px solid #2a2a2a;
        border-radius: 2px;
        color: #f5f5f5;
        padding: 0.5rem 0.7rem;
        font-family: inherit;
      }
      #convertBtn {
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 600;
        padding: 0.85rem 2.2rem;
        border: none;
        border-radius: 2px;
        cursor: pointer;
        background: #f5f5f5;
        color: #0d0d0d;
        transition: opacity 0.15s;
      }
      #convertBtn:hover { opacity: 0.85; }
      #convertBtn:disabled { opacity: 0.35; cursor: not-allowed; }

      /* 결과 */
      #resultWrap {
        width: 100%;
        max-width: 900px;
        display: none;
        margin-bottom: 6rem;
      }
      #trackInfo {
        color: #8a8a8a;
        font-size: 0.9rem;
        margin-bottom: 1rem;
        line-height: 1.7;
      }
      .codeBox {
        position: relative;
        border: 1px solid #2a2a2a;
        border-radius: 4px;
        background: #141414;
      }
      #resultCode {
        width: 100%;
        height: 45vh;
        background: transparent;
        border: none;
        resize: none;
        color: #c9e3c9;
        font-family: "SF Mono", Menlo, monospace;
        font-size: 0.85rem;
        line-height: 1.6;
        padding: 1.2rem;
        outline: none;
        white-space: pre;
      }
      #copyBtn {
        position: absolute;
        top: 0.7rem;
        right: 0.7rem;
        font-family: inherit;
        font-size: 0.8rem;
        padding: 0.45rem 1rem;
        background: #0d0d0d;
        color: #c9c9c9;
        border: 1px solid #3a3a3a;
        border-radius: 2px;
        cursor: pointer;
        transition: color 0.15s;
      }
      #copyBtn:hover { color: #f5f5f5; }
      footer {
        width: 100%;
        max-width: 900px;
        color: #555;
        font-size: 0.85rem;
        border-top: 1px solid #222;
        padding-top: 1.5rem;
      }
    </style>
    <script type="module" crossorigin src="/strudel-music/assets/midi-BcCnco-V.js"></script>
    <link rel="modulepreload" crossorigin href="/strudel-music/assets/modulepreload-polyfill-B5Qt9EMX.js">
  </head>
  <body>
    <header>
      <div class="brand">STRUDEL <span>MUSIC — MIDI 변환</span></div>
      <nav>
        <a href="./index.html" class="navBtn">플레이어</a>
        <a href="./midi.html" class="navBtn active">MIDI 변환</a>
      </nav>
    </header>

    <h1>MIDI 파일을<br />Strudel 코드로 변환합니다.</h1>
    <p class="sub">
      .mid 파일을 올리면 트랙별 노트를 Strudel 패턴 코드로 바꿔줍니다.<br />
      변환된 코드를 복사해서 플레이어 에디터에 붙여넣으면 바로 연주됩니다.
    </p>

    <!-- 업로드 -->
    <div id="dropZone">
      <div class="icon">🎵</div>
      <div class="main">MIDI 파일을 끌어다 놓거나 클릭해서 선택</div>
      <div class="desc">.mid / .midi 지원 · 파일은 브라우저에서만 처리됩니다 (업로드 없음)</div>
    </div>
    <input type="file" id="fileInput" accept=".mid,.midi" />

    <!-- 옵션 + 변환 버튼 -->
    <div class="options">
      <label>사이클당 박자 수
        <input type="number" id="beatsPerCycle" value="4" min="1" max="16" />
      </label>
      <button id="convertBtn" disabled>변환하기</button>
    </div>

    <!-- 결과 -->
    <div id="resultWrap">
      <p id="trackInfo"></p>
      <div class="codeBox">
        <button id="copyBtn">복사</button>
        <textarea id="resultCode" readonly spellcheck="false"></textarea>
      </div>
    </div>

    <footer>
      MIDI 파싱은 브라우저에서 직접 수행됩니다 · 생성된 코드는 자유롭게 수정 가능합니다.
    </footer>

    <script>
      // 내비게이션 버튼 클릭 시 페이드아웃 후 이동
      document.querySelectorAll('.navBtn').forEach((a) => {
        a.addEventListener('click', (e) => {
          const href = a.getAttribute('href');
          if (!href || href === window.location.pathname) return;
          e.preventDefault();
          document.body.classList.add('page-leaving');
          setTimeout(() => { window.location.href = href; }, 120);
        });
      });
    </script>
  </body>
</html>
