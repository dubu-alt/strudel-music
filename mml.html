<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MML 변환 도구 - Strudel Music</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
        background: #0d0d0d;
        color: #f5f5f5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 3rem 1.5rem;
      }
      header {
        width: 100%;
        max-width: 900px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4rem;
      }
      .brand {
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #f5f5f5;
      }
      .brand span { color: #8a8a8a; font-weight: 400; }
      nav { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      .navBtn {
        font-family: inherit;
        font-size: 0.88rem;
        font-weight: 600;
        padding: 0.55rem 1.3rem;
        border-radius: 2px;
        text-decoration: none;
        color: #8a8a8a;
        border: 1px solid #2a2a2a;
        transition: color 0.15s, border-color 0.15s, background 0.15s;
      }
      .navBtn:hover { color: #f5f5f5; border-color: #4a4a4a; }
      .navBtn.active {
        background: #f5f5f5;
        color: #0d0d0d;
        border-color: #f5f5f5;
      }
      body { animation: pageIn 0.25s ease both; }
      body.page-leaving {
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.12s ease, transform 0.12s ease;
      }
      @keyframes pageIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      h1 {
        font-size: 2.6rem;
        font-weight: 800;
        line-height: 1.35;
        letter-spacing: -0.02em;
        margin-bottom: 1.2rem;
        width: 100%;
        max-width: 900px;
      }
      .sub {
        color: #8a8a8a;
        font-size: 1.05rem;
        line-height: 1.7;
        margin-bottom: 3rem;
        width: 100%;
        max-width: 900px;
      }
      .panel {
        width: 100%;
        max-width: 900px;
        border: 1px solid #2a2a2a;
        border-radius: 4px;
        background: #111;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.2rem;
      }
      .optGroup { display: flex; flex-wrap: wrap; gap: 1.2rem 2rem; align-items: center; }
      .optTitle {
        width: 100%;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #666;
        text-transform: uppercase;
      }
      label {
        color: #b5b5b5;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 0.55rem;
        cursor: pointer;
      }
      input[type="number"] {
        width: 5.5rem;
        background: #0d0d0d;
        border: 1px solid #2a2a2a;
        border-radius: 2px;
        color: #f5f5f5;
        padding: 0.45rem 0.65rem;
        font-family: inherit;
        font-size: 0.9rem;
      }
      input[type="checkbox"] {
        width: 1rem;
        height: 1rem;
        accent-color: #f5f5f5;
        cursor: pointer;
      }
      select {
        background: #0d0d0d;
        border: 1px solid #2a2a2a;
        border-radius: 2px;
        color: #f5f5f5;
        padding: 0.45rem 0.65rem;
        font-family: inherit;
        font-size: 0.9rem;
      }
      .trackSection { display: flex; flex-direction: column; gap: 0.8rem; }
      .trackHeader {
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .trackHeader .name {
        font-size: 0.95rem;
        font-weight: 700;
        color: #c9c9c9;
        min-width: 5rem;
      }
      textarea.mmlInput {
        width: 100%;
        min-height: 7rem;
        background: #0d0d0d;
        border: 1px solid #2a2a2a;
        border-radius: 2px;
        resize: vertical;
        color: #c9e3c9;
        font-family: "SF Mono", Menlo, monospace;
        font-size: 0.78rem;
        line-height: 1.6;
        padding: 0.9rem;
        outline: none;
      }
      textarea.mmlInput:focus { border-color: #555; }
      button.primary {
        align-self: flex-start;
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 600;
        padding: 0.85rem 2.2rem;
        border: none;
        border-radius: 2px;
        cursor: pointer;
        background: #f5f5f5;
        color: #0d0d0d;
        transition: opacity 0.15s;
      }
      button.primary:hover { opacity: 0.85; }
      /* 결과 */
      #resultWrap {
        width: 100%;
        max-width: 900px;
        display: none;
        margin-bottom: 6rem;
      }
      #trackInfo {
        color: #8a8a8a;
        font-size: 0.9rem;
        margin-bottom: 1rem;
        line-height: 1.7;
      }
      .codeBox {
        position: relative;
        border: 1px solid #2a2a2a;
        border-radius: 4px;
        background: #141414;
      }
      #resultCode {
        width: 100%;
        height: 50vh;
        background: transparent;
        border: none;
        resize: none;
        color: #c9e3c9;
        font-family: "SF Mono", Menlo, monospace;
        font-size: 0.85rem;
        line-height: 1.6;
        padding: 1.2rem;
        outline: none;
        white-space: pre;
      }
      .codeActions {
        position: absolute;
        top: 0.7rem;
        right: 0.7rem;
        display: flex;
        gap: 0.4rem;
      }
      .codeActions button {
        font-family: inherit;
        font-size: 0.8rem;
        padding: 0.45rem 1rem;
        background: #0d0d0d;
        color: #c9c9c9;
        border: 1px solid #3a3a3a;
        border-radius: 2px;
        cursor: pointer;
        transition: color 0.15s, border-color 0.15s;
      }
      .codeActions button:hover { color: #f5f5f5; border-color: #6a6a6a; }
      footer {
        width: 100%;
        max-width: 900px;
        color: #555;
        font-size: 0.85rem;
        border-top: 1px solid #222;
        padding-top: 1.5rem;
      }
    </style>
    <script type="module" crossorigin src="/strudel-music/assets/mml-BkbS1p3y.js"></script>
    <link rel="modulepreload" crossorigin href="/strudel-music/assets/modulepreload-polyfill-B5Qt9EMX.js">
  </head>
  <body>
    <header>
      <div class="brand">STRUDEL <span>MUSIC — MML 변환</span></div>
      <nav>
        <a href="./index.html" class="navBtn">플레이어</a>
        <a href="./midi.html" class="navBtn">MIDI 변환</a>
        <a href="./mp3.html" class="navBtn">MP3 변환</a>
        <a href="./mml.html" class="navBtn active">MML 변환</a>
      </nav>
    </header>

    <h1>MML 악보를<br />Strudel 코드로 변환합니다.</h1>
    <p class="sub">
      MML(Music Macro Language) 텍스트를 트랙별로 붙여넣으면 노트·화음을 분석해
      Strudel 패턴 코드로 바꿔줍니다.<br />
      생성된 코드를 복사해서 플레이어 에디터에 붙여넣으면 바로 연주됩니다.
    </p>

    <!-- 옵션 -->
    <div class="panel">
      <div class="optGroup">
        <div class="optTitle">설정</div>
        <label title="원곡 BPM">
          BPM
          <input type="number" id="bpm" value="135" min="20" max="300" />
        </label>
        <label title="기본 음 길이 (4 = 4분음표)">
          기본 길이 (L)
          <select id="defaultLen">
            <option value="1">1 온음표</option>
            <option value="2">2 2분음표</option>
            <option value="4" selected>4 4분음표</option>
            <option value="8">8 8분음표</option>
            <option value="16">16 16분음표</option>
          </select>
        </label>
        <label title="멜로디 사운드">
          멜로디 사운드
          <input type="text" id="melodySound" value="sawtooth" style="width:8rem" />
        </label>
        <label title="화음 사운드">
          화음 사운드
          <input type="text" id="chordSound" value="triangle" style="width:8rem" />
        </label>
      </div>
    </div>

    <!-- 트랙 입력 -->
    <div class="panel" id="tracksPanel">
      <div class="trackSection" data-track="0">
        <div class="trackHeader">
          <span class="name">트랙 1 (멜로디)</span>
          <label><input type="checkbox" class="useTrack" checked /> 사용</label>
          <label>옥타브 이동
            <input type="number" class="octShift" value="0" min="-4" max="4" style="width:4rem" />
          </label>
        </div>
        <textarea class="mmlInput" spellcheck="false" placeholder="MML 텍스트를 붙여넣으세요"></textarea>
      </div>
      <button id="addTrackBtn" class="primary" style="background:#222;color:#c9c9c9;border:1px solid #3a3a3a">+ 트랙 추가</button>
      <button id="convertBtn" class="primary">변환하기</button>
    </div>

    <!-- 결과 -->
    <div id="resultWrap">
      <p id="trackInfo"></p>
      <div class="codeBox">
        <div class="codeActions">
          <button id="openPlayerBtn">플레이어에서 열기</button>
          <button id="copyBtn">복사</button>
        </div>
        <textarea id="resultCode" readonly spellcheck="false"></textarea>
      </div>
    </div>

    <footer>
      MML 파싱은 브라우저에서 직접 수행됩니다 · 노트/쉼/옥타브/길이/화음(&) 지원 ·
      코드 규칙은 <a href="https://strudel.cc/workshop/first-notes/" target="_blank" rel="noopener" style="color:#8a8a8a">Strudel 공식 문서</a>를 따릅니다.
    </footer>

    <script>
      // 내비게이션 버튼 클릭 시 페이드아웃 후 이동
      document.querySelectorAll('.navBtn').forEach((a) => {
        a.addEventListener('click', (e) => {
          const href = a.getAttribute('href');
          if (!href || href === window.location.pathname) return;
          e.preventDefault();
          document.body.classList.add('page-leaving');
          setTimeout(() => { window.location.href = href; }, 120);
        });
      });
    </script>
  </body>
</html>
